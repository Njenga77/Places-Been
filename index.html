<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places You've Been</title>
    <link rel="stylesheets" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Places You've Been</h1>
        <div class="row">
            <div class="col-md-6">
                <hr />
                <h2>Add a Place:</h2>
                <form id="new-place">
                    <div class="form-group">
                        <label for="new-location">Location</label>
                        <input type="text" class="form-control" id="new-location" name="new-location">
                    </div>
                    <div class="form-group">
                        <label for="new-landmarks">Landmarks</label>
                        <input type="text" class="form-control" id="new-landmarks" name="new-landmarks">
                    </div>
                    <div class="form-group">
                        <label for="new-time-of-year">Time of Year</label>
                        <input type="text" class="form-control" id="new-time-of-year" name="new-time-of-year">
                    </div>
                    <div class="form-group">
                        <label for="new-notes">Notes</label>
                        <input type="text" class="form-control" id="new-notes" name="new-notes">
                    </div>
                    <button type="submit" class="btn-primary">Add</button>
                </form>
                <hr />
                <h2>Places (click a name):</h2>
                <div id="places">
                </div>
            </div>
            <div class="col-md-6">
                <div id="place-details" class="hidden">
                    <h2>Place Details:</h2>
                    <p>Location: <span class="location"></span></p>
                    <p>Landmarks: <span class="landmarks"></span></p>
                    <p>Time of Year: <span class="time-of-year"></span></p>
                    <p>Notes: <span class="notes"></span></p>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
